[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtk"
version = "0.2.0"
description = "General purpose toolkit for working with medical imaging data. Contains experiment management with Mlflow, Hydra, and AzureML."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "teddygu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate",
    "albumentations",
    "datasets",
    "einops",
    "faiss-gpu-cu12",
    "huggingface-hub",
    "hydra-colorlog",
    "hydra-core",
    "ir-metrics",
    "jsonlines",
    "langfuse",
    "matplotlib",
    "mlflow==3.2.0",
    "omegaconf",
    "open_clip_torch",
    "python-dotenv",
    "rich-argparse",
    "rich==14.1.0",
    "scikit-learn",
    "sentencepiece",
    "tabulate",
    "timm",
    "torch>=2.1.2,<2.9.0",
    "torchvision",
    "transformers>=4.40.0,<5.0.0",
    "xlrd",
]

[project.optional-dependencies]
azureml = ["azure-ai-ml", "azure-identity"]
monai = ["monai", "nibabel", "pydicom", "itk"]
qwen = ["bitsandbytes", "qwen-vl-utils"]
all = ["rtk[azureml,monai,qwen]"]

[project.scripts]
check-cuda = "scripts.check_cuda:main"

[dependency-groups]
dev = [
    "black",
    "flake8",
    "huggingface-hub[cli]",
    "ipykernel",
    "jupyter",
    "mypy",
    "pytest",
    "pytest-cov",
    "tabulate",
]

[tool.uv.sources]
# Add any local or git dependencies here
# Example: mypackage = { path = "../mypackage" }

[tool.uv.workspace]
# Uncomment if this is part of a workspace
# members = ["rtk"]

[tool.setuptools]
packages = ["rtk"]

[tool.setuptools.package-data]
rtk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["--verbose", "--strict-markers", "--tb=short"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | \.egg-info
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
exclude = [
    "*.egg-info",
    ".git",
    ".pytest_cache",
    ".vscode",
    "__pycache__",
    "build",
    "dist",
]
